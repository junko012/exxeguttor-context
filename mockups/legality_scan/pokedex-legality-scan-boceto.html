<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Exxeguttor — Boceto: Pokédex escaneando (verificar/analizar legalidad)</title>
<style>
  :root {
    --bg-window: #ffffff;
    --bg-surface: #f4f4f5;
    --border: #dcdce0;
    --border-strong: #b8b8bf;
    --text-primary: #1c1c1f;
    --text-secondary: #6b6b70;
    --text-muted: #9a9aa0;
    --accent: #3b82f6;
    --pokedex-red: #d9584e;
    --pokedex-red-dark: #4a1b0c;
    --pokedex-lens-ring: #0c447c;
    --pokedex-lens-fill: #e6f1fb;
    --pokedex-lens-glow: #85b7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Cantarell", "Ubuntu", sans-serif;
    background: #e5e5e8;
    padding: 32px;
    display: flex;
    justify-content: center;
  }
  .note {
    position: absolute;
    top: 8px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #6b6b70;
  }
  .card {
    width: 320px;
    background: var(--bg-window);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-top: 40px;
  }
  .status-text { font-size: 15px; font-weight: 600; color: var(--text-primary); margin: 0; }

  .scan-row { display: flex; align-items: center; justify-content: center; gap: 18px; }

  /* ===== Pokédex — primer ícono de UI a color sólido del proyecto (todo lo
     demás es outline monocromático o sprites reales de Pokémon) — decisión
     explícita tomada en sesión de diseño: se ve más reconocible de un
     vistazo que una versión outline, vale la excepción acá. ===== */
  .pokedex-wrap { animation: pokedex-idle 2.4s ease-in-out infinite; }
  @keyframes pokedex-idle {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-3px) rotate(3deg); }
  }
  .pokedex-lens-blink { animation: lens-blink 2.4s ease-in-out infinite; transform-origin: 33px 24px; }
  @keyframes lens-blink {
    0%, 55%, 100% { opacity: 1; }
    60%           { opacity: 0.3; }
    65%           { opacity: 1; }
  }

  /* ===== Pokémon siendo escaneado — el haz de la Pokédex lo recorre de
     arriba a abajo en loop, 2.4s, misma duración que el resto de la escena
     para que se sienta como un solo ciclo coordinado. ===== */
  .scan-subject { position: relative; width: 52px; height: 52px; }
  .scan-beam {
    position: absolute;
    left: -6px; right: -6px;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 6px 1px var(--pokedex-lens-glow);
    animation: scan-sweep 2.4s ease-in-out infinite;
  }
  @keyframes scan-sweep {
    0%, 8%  { top: 6%;  opacity: 0; }
    14%     { opacity: 1; }
    55%     { top: 88%; opacity: 1; }
    62%     { opacity: 0; }
    100%    { top: 88%; opacity: 0; }
  }

  /* ===== Checklist de categorías — MISMAS categorías que ya agrupa
     LegalityMessageMapper (PID/Naturaleza, IVs/Stats, Movimientos, Origen
     del encuentro), no texto inventado para el mockup. Patrón NUEVO para el
     proyecto: ningún loader anterior mostró una lista de sub-pasos, todos
     fueron una sola escena decorativa — decisión de diseño consciente, no
     un accidente de scope. Cada ítem se ilumina en su propio momento del
     ciclo de 2.4s (--d = cue de inicio de ese ítem específico). ===== */
  .checklist { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 2px 4px; }
  .check-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-secondary);
    opacity: 0.35;
    animation: check-in 2.4s ease-in-out infinite;
  }
  .check-item .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--pokedex-lens-fill); color: var(--pokedex-lens-ring);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0;
  }
  @keyframes check-in {
    0%   { opacity: 0.35; }
    12%  { opacity: 1; }
    100% { opacity: 1; }
  }
  .check-1 { animation-delay: 0s; }
  .check-2 { animation-delay: 0.3s; }
  .check-3 { animation-delay: 0.6s; }
  .check-4 { animation-delay: 0.9s; }

  .progress-track { width: 100%; height: 6px; background: var(--bg-surface); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 60%; background: var(--accent); border-radius: 4px; }
</style>
</head>
<body>
<div class="note">Boceto animado — Pokédex escaneando, reemplaza la pokebola genérica en "Verificando legalidad" (al cargar un Pokémon) y "Analizando legalidad" (al exportar)</div>

<div class="card">
  <p class="status-text">Verificando legalidad…</p>

  <div class="scan-row">
    <div class="pokedex-wrap">
      <svg width="66" height="78" viewBox="0 0 66 78">
        <rect x="6" y="8" width="54" height="62" rx="8" fill="var(--pokedex-red)"/>
        <rect x="6" y="34" width="54" height="6" fill="var(--pokedex-red-dark)"/>
        <circle class="pokedex-lens-blink" cx="33" cy="24" r="10" fill="var(--pokedex-lens-fill)" stroke="var(--pokedex-lens-ring)" stroke-width="2.5"/>
        <circle class="pokedex-lens-blink" cx="33" cy="24" r="4" fill="var(--accent)"/>
        <rect x="14" y="48" width="16" height="4" rx="2" fill="#f5c4b3"/>
        <rect x="14" y="56" width="24" height="4" rx="2" fill="#f5c4b3"/>
      </svg>
    </div>

    <div class="scan-subject">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <ellipse cx="26" cy="30" rx="18" ry="16" fill="#f0997b"/>
        <circle cx="19" cy="26" r="3" fill="var(--pokedex-red-dark)"/>
        <circle cx="33" cy="26" r="3" fill="var(--pokedex-red-dark)"/>
      </svg>
      <div class="scan-beam"></div>
    </div>
  </div>

  <div class="checklist">
    <div class="check-item check-1"><span class="dot">&#10003;</span>PID y naturaleza</div>
    <div class="check-item check-2"><span class="dot">&#10003;</span>IVs y stats</div>
    <div class="check-item check-3"><span class="dot">&#10003;</span>Movimientos</div>
    <div class="check-item check-4"><span class="dot">&#10003;</span>Origen del encuentro</div>
  </div>

  <div class="progress-track"><div class="progress-fill"></div></div>
</div>

</body>
</html>
