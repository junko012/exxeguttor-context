<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exxeguttor — Boceto: Pokédex escaneando al abrir un save (reemplaza Loader 1)</title>
<style>
  :root {
    --bg-surface: #f4f4f5;
    --border: #dcdce0;
    --text-primary: #1c1c1f;
    --text-secondary: #6b6b70;
    --accent: #3b82f6;
    --pokedex-red: #d9584e;
    --pokedex-red-dark: #4a1b0c;
    --pokedex-lens-ring: #0c447c;
    --pokedex-lens-fill: #e6f1fb;
    --pokedex-lens-glow: #85b7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "Cantarell", "Ubuntu", sans-serif;
    background: rgba(0,0,0,0.20); /* overlay oscuro, igual que los demás loaders */
    background-color: #8d8d92;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px;
  }
  .note { font-size: 12px; color: #f4f4f5; text-align: center; max-width: 440px; }

  .card {
    width: 340px; background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
  }
  .title { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); }

  /* ===== Escena: 200x170. La lente de la Pokédex es el centro de todo el escaneo. =====
     Pokédex a escala 1.6 (66x78 -> 106x125). Lente en (33,24) del viewBox original. */
  .scene { position: relative; width: 200px; height: 170px; }
  .pokedex {
    position: absolute; left: 47px; top: 22px; width: 106px; height: 125px;
    animation: idle 2.4s ease-in-out infinite;
  }
  @keyframes idle {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-3px) rotate(3deg); }
  }
  .lens { animation: blink 2.4s ease-in-out infinite; transform-origin: 33px 24px; }
  @keyframes blink { 0%,55%,100% {opacity:1} 60% {opacity:.3} 65% {opacity:1} }

  /* Centro del escaneo = lente, en coords de escena: 47+33*1.6=100, 22+24*1.6=60 */
  .ring {
    position: absolute; left: 100px; top: 60px; width: 40px; height: 40px;
    margin: -20px 0 0 -20px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0;
    animation: ring 2.4s ease-out infinite;
  }
  .ring.r2 { animation-delay: .8s; }
  .ring.r3 { animation-delay: 1.6s; }
  @keyframes ring {
    0%   { transform: scale(.4); opacity: .65; }
    100% { transform: scale(4.6); opacity: 0; }
  }
  /* Rayo giratorio desde la lente: cubre los 360° */
  .sweep {
    position: absolute; left: 100px; top: 60px; width: 92px; height: 2px; margin-top: -1px;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, var(--accent), rgba(59,130,246,0));
    animation: sweep 2.4s linear infinite;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  /* Dos líneas que cruzan el cuerpo de la Pokédex (horizontal y vertical) */
  .clip { position: absolute; left: 47px; top: 22px; width: 106px; height: 125px; overflow: hidden; border-radius: 13px; pointer-events: none; }
  .scan-h, .scan-v { position: absolute; background: var(--accent); box-shadow: 0 0 6px 1px var(--pokedex-lens-glow); opacity: .85; }
  .scan-h { left: 0; right: 0; height: 2px; animation: sh 2.4s ease-in-out infinite; }
  .scan-v { top: 0; bottom: 0; width: 2px; animation: sv 2.4s ease-in-out infinite .6s; }
  @keyframes sh { 0%,100% { top: 0; } 50% { top: calc(100% - 2px); } }
  @keyframes sv { 0%,100% { left: 0; } 50% { left: calc(100% - 2px); } }

  /* Progreso: barra REAL (mismo patrón que Loader 1/4) + etapa actual */
  .progress-block { width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .track { height: 6px; background: #e5e5ea; border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease-out; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
  .meta .pct { font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text-primary); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .pokedex, .lens, .ring, .sweep, .scan-h, .scan-v { animation: none; }
    .ring { opacity: .3; transform: scale(2.2); }
  }
</style>
</head>
<body>
<div class="note">Boceto animado — reemplaza el Loader 1 (Hitmonlee/Voltorb/Dugtrio) al abrir un save. El progreso de la demo reproduce los hitos reales de <code>OpenSaveFromPathAsync</code> (45 / 55 / 75 / 85 / 100 %).</div>

<div class="card" role="status" aria-live="polite">
  <p class="title">Abriendo partida guardada…</p>

  <div class="scene" aria-hidden="true">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="pokedex">
      <svg width="106" height="125" viewBox="0 0 66 78">
        <rect x="6" y="8" width="54" height="62" rx="8" fill="var(--pokedex-red)"/>
        <rect x="6" y="34" width="54" height="6" fill="var(--pokedex-red-dark)"/>
        <circle class="lens" cx="33" cy="24" r="10" fill="var(--pokedex-lens-fill)" stroke="var(--pokedex-lens-ring)" stroke-width="2.5"/>
        <circle class="lens" cx="33" cy="24" r="4" fill="var(--accent)"/>
        <rect x="14" y="48" width="16" height="4" rx="2" fill="#f5c4b3"/>
        <rect x="14" y="56" width="24" height="4" rx="2" fill="#f5c4b3"/>
      </svg>
    </div>
    <div class="clip"><div class="scan-h"></div><div class="scan-v"></div></div>
    <div class="sweep"></div>
  </div>

  <div class="progress-block">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="stage">Leyendo el archivo…</span><span class="pct" id="pct">0 %</span></div>
  </div>
</div>

<button id="replay" type="button">Reiniciar demo</button>

<script>
  // Hitos reales de OpenSaveFromPathAsync (ver MainWindowViewModel). ms = duración simulada del tramo.
  const steps = [
    { to: 0.45, label: "Leyendo el archivo…",      ms: 900 },
    { to: 0.55, label: "Cargando entrenador…",     ms: 250 },
    { to: 0.75, label: "Preparando cajas…",        ms: 1100 },
    { to: 0.85, label: "Preparando equipo…",       ms: 300 },
    { to: 1.00, label: "Preparando mochila…",      ms: 900 }
  ];
  const fill = document.getElementById('fill'), pct = document.getElementById('pct'), stage = document.getElementById('stage');
  let timer;
  function set(v, label) { fill.style.width = (v*100)+'%'; pct.textContent = Math.round(v*100)+' %'; if (label) stage.textContent = label; }
  function run() {
    clearTimeout(timer); set(0, steps[0].label);
    let i = 0;
    (function next() {
      if (i >= steps.length) { timer = setTimeout(run, 1400); return; }
      const s = steps[i++];
      timer = setTimeout(() => { set(s.to, i < steps.length ? steps[i].label : "Listo"); next(); }, s.ms);
    })();
  }
  document.getElementById('replay').addEventListener('click', run);
  run();
</script>
</body>
</html>
