<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Exxeguttor — Boceto: Carrusel de tips de edición</title>
<style>
  :root {
    --bg-window: #ffffff;
    --bg-surface: #f4f4f5;
    --border: #dcdce0;
    --border-accent: #3b82f6;
    --text-primary: #1c1c1f;
    --text-secondary: #6b6b70;
    --text-muted: #9a9aa0;
    --accent: #3b82f6;
    --accent-bg: #eaf1fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Cantarell", "Ubuntu", sans-serif;
    background: rgba(20,20,24,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .note {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #eee;
    background: #1c1c1f;
    border-radius: 6px;
    padding: 4px 12px;
  }
  .modal {
    width: 380px;
    background: var(--bg-window);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title { font-size: 15px; font-weight: 600; margin: 0; color: var(--text-primary); }
  .close-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid var(--border); background: #fff; cursor: pointer;
    font-size: 12px; color: var(--text-secondary);
  }

  .body { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .tip-card { width: 100%; background: var(--bg-surface); border: 1.5px solid var(--border-accent); border-radius: 14px; overflow: hidden; }
  .tip-card-head { background: var(--accent-bg); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
  .tip-category { font-size: 11px; color: var(--accent); font-weight: 600; }
  .tip-counter { font-size: 10px; color: var(--accent); }
  .tip-card-body { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tip-sprite { width: 64px; height: 64px; image-rendering: pixelated; }
  .tip-title { font-size: 14px; font-weight: 600; margin: 0; text-align: center; color: var(--text-primary); }
  .tip-text { font-size: 13px; color: var(--text-secondary); margin: 0; text-align: center; line-height: 1.5; }
  .tip-text code { background: var(--bg-window); border-radius: 4px; padding: 1px 6px; }

  .nav-row { display: flex; align-items: center; gap: 16px; }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 15px; color: var(--text-secondary);
  }
  .dots { display: flex; gap: 5px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
  .dot.active { width: 7px; height: 7px; background: var(--accent); }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip {
    font-size: 10px; border-radius: 10px; padding: 3px 9px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--text-muted);
  }
  .chip.active { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--accent); }
</style>
</head>
<body>

<div class="note">Boceto estático — Carrusel de tips de edición (una tarjeta a la vez)</div>

<div class="modal">
  <div class="header">
    <p class="header-title">Tips de edición</p>
    <button class="close-btn">✕</button>
  </div>

  <div class="body">

    <div class="tip-card">
      <div class="tip-card-head">
        <span class="tip-category">Creación</span>
        <span class="tip-counter">Tip 3 de 8</span>
      </div>
      <div class="tip-card-body">
        <img class="tip-sprite" src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites/sprites/pokemon/54.png" alt="Psyduck" />
        <p class="tip-title">Salto rápido por teclado</p>
        <p class="tip-text">Al crear un Pokémon, mantené <code>Shift</code> mientras usás las flechas para saltar de a diez resultados en vez de uno.</p>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn">‹</button>
      <div class="dots">
        <span class="dot"></span><span class="dot"></span><span class="dot active"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
      </div>
      <button class="nav-btn">›</button>
    </div>

    <div class="chip-row">
      <span class="chip">General</span>
      <span class="chip active">Creación</span>
      <span class="chip">Edición</span>
      <span class="chip">Legalidad</span>
    </div>

  </div>
</div>

</body>
</html>
